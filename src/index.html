// небо и солнце (вечер, «золотой час»)

const envScene = new THREE.Scene();
const envSky = new Sky(); envSky.scale.setScalar(4500);

const sc = sun.shadow.camera; sc.left = -38; sc.right = 38; sc.top = 38; sc.bottom = -38; sc.near = 1; sc.far = 220;

// ================= утилиты мира =================
let seed = 1990;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }

  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;

// ================= земля и дорога =================
{

function house(cx, cz, face) { // face: +1 фасад к +z, -1 к -z

  box(0.5, 1.6, 0.5, cx + w * 0.22, base + h + rh * 0.55, cz - face * 0.6, M.white);
  box(0.62, 0.12, 0.62, cx + w * 0.22, base + h + rh * 0.55 + 0.82, cz - face * 0.6, M.woodDark);
  const n = w > 9.6 ? 3 : 2, fz = cz + face * (d / 2);

    box(1.35, 0.1, 0.25, wx, base + 1.05, fz + face * 0.12, M.white);

  const px = cx + w / 2 + 1.1;

}

function textSprite(text, color = '#fff8e6', bg = 'rgba(30,22,14,.55)', h = 0.32) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = 'bold 40px system-ui, sans-serif';
  const w = Math.ceil(g.measureText(text).width) + 36; c.width = w; c.height = 60;
  g.font = 'bold 40px system-ui, sans-serif';
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect ? g.roundRect(0, 0, w, 60, 14) : g.rect(0, 0, w, 60); g.fill(); }
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, 32);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, fog: false }));
  s.scale.set(h * w / 60, h, 1);
  return s;
}

      else if (u.mode === 'swing') { const t = Math.min(u.t / 0.16, 1); th = -2.3 + (2.6 + 2.3) * t; batA = -0.3 + 0.5 * t; left = 0.8 * t; if (u.t > 1.1) kidAct(k, 'idle'); }
      else if (u.mode === 'cheer') { th = Math.PI + Math.sin(u.t * 12) * 0.3; left = Math.PI - Math.sin(u.t * 12) * 0.3; k.position.y = Math.abs(Math.sin(u.t * 7)) * 0.18 * Math.max(0, 1 - u.t / 2.5); }
      else if (u.mode === 'sad') { th = 0.1; left = 0.1; u.head.rotation.z = -0.35 * Math.min(1, u.t * 3); }
      if (u.mode !== 'sad') u.head.rotation.z *= 0.9;
      if (u.mode !== 'cheer') k.position.y *= 0.8;
    } else { k.position.y *= 0.8; u.head.rotation.z *= 0.9; }
    u.arms[1].rotation.z = th; u.arms[0].rotation.z = left; u.bat.rotation.z = batA;
  });

  // гуси
  for (const g of geese) {
    const u = g.userData;
    let sp = 0.25;
    if (u.flee > 0) { u.flee -= rdt; sp = 3.2; const away = Math.sign(g.position.x - X) || 1; u.dir += (Math.atan2(R(-0.5, 0.5), away) - u.dir) * 0.2; }
    else u.dir += (Math.random() - 0.5) * rdt * 1.5;
    g.position.x += Math.cos(u.dir) * sp * rdt; g.position.z += Math.sin(u.dir) * sp * rdt;
    if (g.position.z < 4.8) u.dir = Math.abs(u.dir); if (g.position.z > 10) u.dir = -Math.abs(u.dir);
    g.rotation.y = -u.dir;
    u.ph += rdt * (sp > 1 ? 14 : 4);
    g.position.y = Math.abs(Math.sin(u.ph)) * (sp > 1 ? 0.05 : 0.015);
    const peck = sp < 1 ? Math.max(0, Math.sin(u.ph * 0.37)) : 0;
    u.head.position.y = 0.84 - peck * 0.55; u.beak.position.y = 0.83 - peck * 0.55; u.neck.rotation.z = -0.35 - peck * 0.9;
  }

  // флажки
  const flags = [];
  if (best > 0) flags.push({ d: best, label: T('record'), c: '#b5321f' });
  if (mode === 'online' && S) {
    const colors = ['#2d5aa8', '#b33a2a', '#3d7a45', '#d0812c'];
    S.players.forEach((p, i) => { const b = Math.max(0, ...p.shots); if (b > 0) flags.push({ d: b, label: p.name, c: colors[i % 4] }); });
  }
  rebuildFlags(flags);
  flagGroup.children.forEach((g, i) => { g.userData.cloth.rotation.y = Math.sin(time * 3 + i) * 0.35; });

  // облака
  for (const c of clouds) { c.position.x += rdt * 1.5; if (c.position.x > 900) c.position.x = -250; }
  grassTime.value = time;

  // камера
  const portrait = W / H < 1 ? 1.5 : 1;
  let k = 2.5;
  if (fl.phase === 'hit') {
    dPos.set(X - 7 * portrait, Math.max(2.2, Y * 0.55 + 1.9), 7.2 * portrait);
    dLook.set(X + 4, Y * 0.8 + 0.6, -0.6); k = 3.4;
  } else if (fl.phase === 'done' && X > 3) {
    orbitA += rdt * 0.18;
    dPos.set(X - 6 * portrait * Math.cos(orbitA), 2.0 + orbitA * 0.4, 2 + 5.5 * portrait * Math.cos(orbitA * 0.7));
    dLook.set(X, 0.4, 0); k = 1.6;
  } else {
    const up = fl.phase === 'tossed' ? Y : 0;
    if (portrait > 1) dPos.set(-1.6, 1.7 + up * 0.4, 6.8 + up * 0.3);
    else dPos.set(-3.9, 1.6 + up * 0.3, 4.5 + up * 0.25);
    dLook.set(portrait > 1 ? -0.45 : 1.4, 0.9 + up * 0.75, -0.3);
  }
  const f = 1 - Math.exp(-k * rdt);
  camPos.lerp(dPos, f); camLook.lerp(dLook, f);
  camera.position.copy(camPos);
  if (shake > 0) { shake -= rdt; camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; }
  camera.lookAt(camLook);

  // тени следуют за камерой
  sun.target.position.set(camLook.x + 6, 0, 0);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 120);
}

// таймер хода
function updateTimer() {
  if (mode === 'online' && S && S.phase === 'playing' && !S.busy && S.deadline && fl.phase !== 'hit') {
    const left = Math.max(0, Math.ceil((S.deadline - (Date.now() - skew)) / 1000));
    timerEl.textContent = left <= 10 ? left + ' ' + T('sec') : '';
  } else timerEl.textContent = '';
}

let last = performance.now();
function loop(now) {
  const rdt = Math.min(Math.max((now - last) / 1000, 0), 0.05);
  last = now;
  let dt = rdt;
  if (slowmo > 0) { slowmo -= rdt; dt = rdt * 0.25; }
  update(dt);
  updateScene(dt, rdt, now / 1000);
  updateTimer();
  vintage.uniforms.uTime.value = now / 1000;
  composer.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);

function applyLang(l) {
  lang = l; store.set('turca_lang', l); document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach((e) => { e.placeholder = T(e.dataset.ph); });
  document.querySelectorAll('.lang').forEach((b) => b.classList.toggle('on', b.dataset.l === l));
  for (const [lb, m] of markers) { const n = textSprite(m + ' ' + T('unit'), '#2a241c', 'rgba(251,248,238,.9)', 0.38); lb.material.map.dispose(); lb.material.map = n.material.map; lb.scale.copy(n.scale); }
  flagKey = '';
  if (qCode && !mode) $('menuErr').textContent = T('invited', { c: qCode.toUpperCase().slice(0, 4) });
  else if ($('menuErr').textContent) $('menuErr').textContent = '';
  if (mode === 'solo' && fl.phase === 'ready') msgEl.innerHTML = T('hint1') + '<br><small>' + T('hint2') + '</small>';
  if (mode === 'online' && S) renderState();
  if (fl.phase === 'done' && distEl.textContent) distEl.textContent = fmt(fl.result != null ? fl.result : meters());
}
document.querySelectorAll('.lang').forEach((b) => { b.onclick = () => applyLang(b.dataset.l); });
applyLang(lang);
</script>
