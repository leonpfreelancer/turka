<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87c5ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Țurca</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87c5ea; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 12px 16px; font: 600 18px system-ui, sans-serif; color: #1d2b36; display: flex; justify-content: space-between; pointer-events: none; }
  #msg { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font: 700 24px system-ui, sans-serif; color: #1d2b36; pointer-events: none; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="dist">0 м</span><span id="best">Рекорд: 0 м</span></div>
<div id="msg">Тапни — цурка подлетит.<br>Пока она в воздухе — свайпни, чтобы ударить.</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const distEl = document.getElementById('dist');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  // --- настройки (крутить здесь) ---
  const PX_PER_M = 40;        // пикселей в метре
  const GRAVITY = 1400;       // px/s^2
  const TOSS_SPEED = 720;     // скорость подброса, px/s
  const POWER = 2.2;          // множитель силы свайпа
  const MAX_SPEED = 2600;     // ограничение скорости после удара, px/s
  const BOUNCE = 0.35;        // отскок от земли
  const FRICTION = 0.6;       // трение по земле

  let W, H, groundY, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H * 0.78;
  }
  window.addEventListener('resize', resize);
  resize();

  let best = 0;
  try { best = parseFloat(localStorage.getItem('turca_best')) || 0; } catch (e) {}
  bestEl.textContent = 'Рекорд: ' + best.toFixed(1) + ' м';

  const START_X = 80;
  // state: ready -> tossed -> hit -> done
  let state, t;
  function reset() {
    state = 'ready';
    t = { x: START_X, y: 0, vx: 0, vy: 0, a: 0, va: 0 }; // y = высота над землёй (px)
    distEl.textContent = '0 м';
  }
  reset();

  // --- ввод ---
  let sw = null;
  function pos(e) { const p = e.changedTouches ? e.changedTouches[0] : e; return { x: p.clientX, y: p.clientY, t: performance.now() }; }

  function down(e) {
    e.preventDefault();
    if (state === 'ready') {
      state = 'tossed';
      t.vy = TOSS_SPEED; t.va = 14;
      msgEl.textContent = '';
      return;
    }
    if (state === 'done') { reset(); msgEl.innerHTML = 'Тапни — цурка подлетит.'; return; }
    if (state === 'tossed') sw = pos(e);
  }
  function up(e) {
    e.preventDefault();
    if (state !== 'tossed' || !sw) return;
    const p = pos(e);
    const dx = p.x - sw.x, dy = sw.y - p.y; // вверх = +
    const dt = Math.max((p.t - sw.t) / 1000, 0.04);
    sw = null;
    const len = Math.hypot(dx, dy);
    if (len < 30 || dx <= 0) return; // нужен свайп вправо
    // лучший момент — около верхней точки
    const peak = TOSS_SPEED * TOSS_SPEED / (2 * GRAVITY);
    const timing = 0.5 + 0.5 * Math.min(t.y / peak, 1);
    let speed = Math.min((len / dt) * POWER * 0.25 * timing, MAX_SPEED);
    const ang = Math.atan2(Math.max(dy, 0), dx);
    t.vx = Math.cos(ang) * speed;
    t.vy = Math.sin(ang) * speed + 150;
    t.va = 20 + speed / 60;
    state = 'hit';
  }
  cv.addEventListener('touchstart', down, { passive: false });
  cv.addEventListener('touchend', up, { passive: false });
  cv.addEventListener('mousedown', down);
  cv.addEventListener('mouseup', up);

  // --- физика ---
  function step(dt) {
    if (state === 'ready' || state === 'done') return;
    t.vy -= GRAVITY * dt;
    t.x += t.vx * dt;
    t.y += t.vy * dt;
    t.a += t.va * dt;
    if (t.y <= 0) {
      t.y = 0;
      if (state === 'tossed') { // не попал
        state = 'done';
        msgEl.innerHTML = 'Мимо! Тапни, чтобы попробовать ещё.';
        return;
      }
      if (Math.abs(t.vy) > 120) {
        t.vy = -t.vy * BOUNCE; t.vx *= FRICTION; t.va *= 0.5;
      } else {
        t.vy = 0; t.vx *= Math.pow(0.02, dt);
        t.va *= Math.pow(0.02, dt);
        if (Math.abs(t.vx) < 8) finish();
      }
    }
    if (state === 'hit') distEl.textContent = meters().toFixed(1) + ' м';
  }
  const meters = () => Math.max(0, (t.x - START_X) / PX_PER_M);

  function finish() {
    state = 'done';
    const d = meters();
    let txt = d.toFixed(1) + ' м';
    if (d > best) {
      best = d;
      try { localStorage.setItem('turca_best', String(best)); } catch (e) {}
      bestEl.textContent = 'Рекорд: ' + best.toFixed(1) + ' м';
      txt = 'Новый рекорд! ' + txt;
    }
    msgEl.innerHTML = txt + '<br><small>Тапни, чтобы сыграть ещё</small>';
  }

  // --- отрисовка ---
  function draw() {
    const camX = Math.max(0, t.x - W * 0.35);
    ctx.clearRect(0, 0, W, H);
    // небо
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#87c5ea'); g.addColorStop(1, '#d9eef9');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
    // земля
    ctx.fillStyle = '#6aa84f'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#5a9442'; ctx.fillRect(0, groundY, W, 6);
    // метки каждые 5 м
    ctx.fillStyle = '#1d2b36'; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
    const first = Math.floor(camX / (PX_PER_M * 5)) * 5;
    for (let m = first; m * PX_PER_M - camX < W + 50; m += 5) {
      const sx = START_X + m * PX_PER_M - camX;
      ctx.fillRect(sx - 1, groundY, 2, 12);
      ctx.fillText(m + ' м', sx, groundY + 28);
    }
    // рекорд
    if (best > 0) {
      const bx = START_X + best * PX_PER_M - camX;
      ctx.fillStyle = '#c0392b'; ctx.fillRect(bx - 1, groundY - 40, 2, 40);
      ctx.fillText('рекорд', bx, groundY - 46);
    }
    // ямка / камень старта
    const sx0 = START_X - camX;
    ctx.fillStyle = '#7b5a3a';
    ctx.beginPath(); ctx.ellipse(sx0, groundY + 2, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
    // бита (палка игрока)
    if (state === 'ready' || state === 'tossed') {
      ctx.save(); ctx.translate(sx0 - 40, groundY - 10); ctx.rotate(-0.9);
      ctx.fillStyle = '#a0522d'; ctx.fillRect(-4, -70, 8, 80); ctx.restore();
    }
    // цурка
    ctx.save();
    ctx.translate(t.x - camX, groundY - 5 - t.y);
    ctx.rotate(t.a);
    ctx.fillStyle = '#c8955c';
    ctx.beginPath();
    ctx.moveTo(-18, 0); ctx.lineTo(-12, -4); ctx.lineTo(12, -4); ctx.lineTo(18, 0);
    ctx.lineTo(12, 4); ctx.lineTo(-12, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7b5a3a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
